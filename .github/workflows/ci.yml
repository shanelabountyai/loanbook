name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Ephemeral runner-local Postgres, gone when the job ends.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loanbook_test?connection_limit=10&pool_timeout=20
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/loanbook_test?connection_limit=10&pool_timeout=20
      AUTH_SECRET: ci-only-secret-not-for-real-use-0123456789abc
      APP_URL: http://localhost:4700
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: America/Chicago # a non-UTC server zone, like the laptop's, so the db timezone test can go red here
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: createdb loanbook_test
      - run: npx prisma migrate deploy
      # The gate: if either fails, nothing after it runs (CLAUDE.md non-negotiable 7).
      - run: npm run fixtures:check
      - name: THROWAWAY plant an unbalanced entry
        run: |
          psql -d loanbook_test -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SET LOCAL session_replication_role = replica;
          WITH e AS (
            INSERT INTO "LedgerEntry" ("id", "date", "loanId", "memo")
            VALUES (gen_random_uuid(), '2026-01-01', 'L1', 'THROWAWAY unbalanced') RETURNING "id")
          INSERT INTO "LedgerLine" ("id", "entryId", "position", "account", "debitCents", "creditCents")
          SELECT gen_random_uuid(), e."id", v.p, v.a, v.d, v.c
          FROM e, (VALUES (0, 'loans_receivable', 100, 0), (1, 'cash', 0, 99)) AS v(p, a, d, c);
          COMMIT;
          SQL
      - run: npm run ledger:verify
      - run: npx vitest run
      # Production build, served — the way it ships. login.spec.ts drives a real page.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  # Spec §4 / §13.3: both modules deleted by the manifest, and the tree must still generate, typecheck, build and pass drift.
  modules-removed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run foundation:check-modules
